[project]
name = "quickdblp"
version = "0.1.0"
requires-python = "==3.13.3"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "duckdb==1.4.3",
    "lxml==6.0.2",
    "requests==2.32.5",
]

[project.scripts]
quickdblp = "quickdblp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
# optional browser tests: uv sync --group ui
ui = [
    "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quickdblp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
