name: Package ponder_dblp binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.23.0'

      - name: Install Ninja
        run: |
          python -m pip install ninja
          ninja --version

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cd ponder_dblp
          cmake --preset=x64-release

      - name: Build
        run: |
          cd ponder_dblp
          cmake --build --preset=x64-release --target install

      - name: Smoke test (parse the small sample)
        shell: bash
        run: |
          mkdir smoke && cd smoke
          ../ponder_dblp/install/windows/x64-release/bin/ponder_dblp.exe ../mini.rdf.gz
          grep '"total_papers": 6' dblp_metadata.json

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p package
          shopt -s extglob
          cp ponder_dblp/install/windows/x64-release/bin/!(*.pdb) package/

      - name: Upload binaries as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ponder_dblp-windows
          path: package

  linux:
    # Ubuntu 24.04: GCC 13 is needed (the metadata writer streams file times, which older libstdc++ versions cannot).
    # The C++ runtime is linked in, so the binary only needs glibc 2.39 or newer.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config zip unzip curl tar

      - name: Configure CMake
        run: |
          cd ponder_dblp
          cmake --preset=linux-x64-release

      - name: Build
        run: |
          cd ponder_dblp
          cmake --build --preset=linux-x64-release --target install

      - name: Smoke test (parse the small sample)
        run: |
          mkdir smoke && cd smoke
          ../ponder_dblp/install/linux/x64-release/bin/ponder_dblp ../mini.rdf.gz
          grep '"total_papers": 6' dblp_metadata.json

      - name: Package binary
        run: |
          mkdir -p package
          # a tar archive keeps the executable bit, which a plain download of the file would lose
          tar -C ponder_dblp/install/linux/x64-release/bin -czf package/ponder_dblp-linux-x64.tar.gz ponder_dblp

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ponder_dblp-linux
          path: package

  release:
    # one release for all platforms, only for version tags (a manual run just leaves the artifacts)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the binaries of all platforms
        uses: actions/download-artifact@v8
        with:
          path: package
          merge-multiple: true

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v3
        with:
          files: package/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
